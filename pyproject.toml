[project]
name = "rga-poc"
version = "0.0.1"
description = "Agentic Requirement Gathering & Analysis — PoC (Phase 1)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
